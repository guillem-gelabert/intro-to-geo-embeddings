# Per-notebook reflection/stretch appendix content for derived exercise notebooks.
# Keyed by notebook slug (input filename stem). Populated with real content in
# 06-02/06-03; placeholders here so the generator (06-01) has a valid schema to
# read against before that content exists.
00_embedding_refresher:
  reflection:
    - "Why does L2-normalizing a vector turn the dot product into cosine similarity? What would change if the vectors were not normalized first?"
    - "The PCA scatter separates cluster A from cluster B on the toy matrix. Does that mean PC1 and PC2 correspond to a named, physical variable? Why or why not?"
    - "The classifier reaches high accuracy on 6 tiny synthetic points. What about this toy setup makes that result unsurprising, and why wouldn't the same accuracy number be trustworthy on real AlphaEarth data?"
  stretch:
    - "Change `cluster_b_center`'s offset from the origin (currently +4.0) to a smaller value and re-run the cosine similarity matrix — at what offset do the two clusters stop being cleanly separable?"
    - "Add a third synthetic cluster and re-fit the PCA and the classifier. Does a linear classifier still separate all three classes cleanly?"
    - "Reproject the three toy points to a different projected CRS (e.g. EPSG:32632, UTM zone 32N) instead of EPSG:2056 and compare the resulting coordinates — why do they differ?"
00b_representation_inspection:
  reflection:
    - "AlphaEarth is a pixel embedding and Clay is a patch embedding. What breaks if you compare their raw vectors as if they described 'the same location' without first accounting for that difference in spatial unit?"
    - "Why is a Clay embedding tied to one Sentinel-2 scene's date, while an AlphaEarth embedding is tied to a full calendar year? What does that imply about using them together to study change over time?"
    - "SatCLIP produces a location embedding with no observation date at all. What kind of question could a location embedding answer that a pixel or patch embedding cannot, and vice versa?"
  stretch:
    - "Load a different point from `bern` (not `.iloc[0]`) and confirm its AlphaEarth vector is also 64-D and unit-norm — is unit-norm true for every row, or just this one?"
    - "Compute the cosine similarity between the AlphaEarth pixel vector and the Clay patch vector directly. Does the resulting number mean anything, given they are different embedding spaces?"
    - "If `torch` is installed in your environment, replace the placeholder `satclip_vector` with a real SatCLIP forward pass (see the isolated `envs/clay/` environment) and compare its dimensionality to AlphaEarth and Clay."
01_alphaearth_access_visualize:
  reflection:
    - "Why does averaging raw int8 AlphaEarth values silently corrupt the data, while averaging the dequantized, unit-norm vectors does not?"
    - "The pseudo-RGB composite looks geographically structured even though the three axes plotted have no assigned physical meaning. What is actually driving that visual structure?"
    - "Path A (Earth Engine) and Path B (the bundled clip) are described as reaching 'identical conclusions.' What exactly stays identical, and what is necessarily different between the two paths (e.g. AOI size, live vs. frozen data)?"
  stretch:
    - "Change the three visualization band indices (`A01, A16, A09`) to a different triple and re-run the pseudo-RGB composite — does the landscape still look structured?"
    - "Increase `n_components` in the PCA call from 3 to 6 and inspect the second and third principal components' maps — do they separate different landscape features than PC1?"
    - "Pick a different pixel (not the center) for the by-hand dequantization walkthrough and confirm your manual result still matches `dequantize_aef`'s output."
02_similarity_and_classification:
  reflection:
    - "Why did leave-region-out cost more balanced-accuracy points than spatial-block CV? Which class collapsed most when the model trained on Bern was evaluated on Seville?"
    - "The positive-minus-negative prototype is described as 'sharpening' a query. What is it removing that a positive-only polygon-mean prototype cannot remove on its own?"
    - "The random-split accuracy and the spatial-block CV accuracy sit close together in-region, but leave-region-out shows a large gap. What does that difference imply about what a random split actually measures versus what leave-region-out measures?"
  stretch:
    - "Change `K` in the search-by-example section and re-run precision@k — at what K does precision drop below 0.7 for the query point used in this notebook?"
    - "Pick a different `QUERY_ID` in a different land-cover class and rebuild the single-pixel and polygon-mean prototypes for it — does the polygon-mean prototype still outperform the single-pixel query?"
    - "Re-run the Sentinel-2 baseline comparison and check whether its in-region block-CV gap is larger or smaller than the AlphaEarth embeddings' gap — does that support or contradict the notebook's leakage-resistance hypothesis?"
03_change_detection_and_validation:
  reflection:
    - "The WRONG-conclusion cell used a fixed threshold of 0.25 -- what does the calibrated threshold from precision_recall_curve turn out to be, and why does the fixed guess fail?"
    - "The transition-matrix axes are labeled 'predicted,' never 'true' -- what would it mean, and why would it be wrong, to read this matrix as an observed 2018-vs-2021 ground-truth transition?"
    - "The pooled 2018+2021 table groups by year for LeaveOneGroupOut CV instead of by spatial block -- what specific kind of leakage does grouping by year prevent that spatial-block grouping alone would miss?"
  stretch:
    - "Recompute the transition matrix using StratifiedGroupKFold instead of GroupKFold and compare balanced_accuracy."
    - "Swap the proxy known_change/known_unchanged definition for a stricter one (e.g. tighten the imd_2018 thresholds) and see how much the calibrated threshold shifts."
    - "Fold crop-to-built into the artificialized mask unconditionally (remove the 20% relative-size guard) and compare the spatial-block vs leave-one-year-out CV gap to the original mask's gap."
04_embedding_ecosystems:
  reflection:
    - "TESSERA's checkpoint cell only reports the norm diagnostic instead of asserting it like AlphaEarth's Module 3 checkpoint -- why is a hard assert wrong here, given what the notebook says about TESSERA's documented guarantees?"
    - "Clay's embeddings are 1024-D and TESSERA's are 128-D, yet the same cosine_similarity_map and norm_diagnostics helpers work unchanged on both -- what does 'provider portability' mean here, and what does it explicitly NOT mean about comparing scores across providers?"
    - "LGND returns ranked stac_item_id/score pairs instead of raw vectors -- what capability do you lose, and what do you gain, compared to TESSERA/Clay handing you the vectors directly?"
  stretch:
    - "Extend the TESSERA similarity ranking to all 5 query points (not just similarity-to-first) and compare which point pairs rank most similar across TESSERA vs the AlphaEarth embeddings from Module 3 for the same locations."
    - "Write a small helper that runs norm_diagnostics across all three providers (TESSERA, Clay, and a re-loaded AlphaEarth sample) and tabulates mean/std norm side by side."
    - "If you have an LGND trial token, re-run the LGND cell live and compare the real API response's score distribution against the bundled fixture's."
05_capstone_artificialization:
  reflection:
    - "The rubric weights validation design at 30%, more than any other single row -- why would 'a convincing classifier with a dishonest validation' fail this rubric even if every other row scored well?"
    - "The feature matrix stacks the most-recent-year embedding with a change-score column rather than using the change score alone -- what ambiguity does a delta-only feature fail to resolve that this baseline-aware design does?"
    - "The held-out region's feature matrix pads a zero change-score column instead of computing a real one -- what real limitation does that zero column represent, and how might it understate or overstate the leave-region-out result?"
  stretch:
    - "Swap AOI = 'bern' for AOI = 'seville' and compare the spatial-block vs leave-region-out balanced-accuracy gap in both directions."
    - "Replace the AlphaEarth-only feature matrix with a concatenation of AlphaEarth and TESSERA vectors for the same points (Module 5) and re-run both validations."
    - "Recompute the model-level uncertainty margin using predict_proba from a RandomForestClassifier instead of LogisticRegression and compare how many points fall below the 0.2 margin threshold."
